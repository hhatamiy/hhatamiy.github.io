<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Your Name</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <div class="logo">Portfolio</div>
                <ul class="nav-links">
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="container">
                <div class="hero-content">
                    <h1 id="hero-name">Your Name</h1>
                    <p id="hero-title" class="hero-subtitle">Software Developer</p>
                    <p id="hero-description" class="hero-description">Building amazing things with code</p>
                    <div class="hero-links">
                        <a href="#" id="github-link" class="btn btn-primary" target="_blank">GitHub</a>
                        <a href="#" id="linkedin-link" class="btn btn-secondary" target="_blank">LinkedIn</a>
                    </div>
                </div>
            </div>
        </section>

        <section id="about" class="about">
            <div class="container">
                <h2>About Me</h2>
                <div class="about-content">
                    <p id="about-text">Add your about section here.</p>
                </div>
            </div>
        </section>

        <section id="projects" class="projects">
            <div class="container">
                <h2>Projects</h2>
                <div id="projects-grid" class="projects-grid">
                    <!-- Projects will be dynamically loaded here -->
                </div>
            </div>
        </section>

        <section id="contact" class="contact">
            <div class="container">
                <h2>Get In Touch</h2>
                <p id="contact-text">Feel free to reach out!</p>
                <div class="contact-links">
                    <a href="#" id="contact-email" class="contact-link">Email</a>
                    <a href="#" id="contact-github" class="contact-link" target="_blank">GitHub</a>
                    <a href="#" id="contact-linkedin" class="contact-link" target="_blank">LinkedIn</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year"></span> <span id="footer-name">Your Name</span>. All rights reserved.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
